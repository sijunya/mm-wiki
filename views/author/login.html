<div class="login-wrapper">
    <div class="login-container">
        <!-- 左侧 Hero 品牌展示 -->
        <div class="login-hero-panel">
            <div class="hero-brand-header">
                <img src="/static/images/logo_icon.png" class="hero-logo-img" alt="MM-Wiki Logo">
                <span class="hero-brand-name">MM-Wiki</span>
            </div>

            <div class="hero-tagline-box">
                <h1 class="hero-tagline-title">团队协作与文档知识分享平台</h1>
                <p class="hero-tagline-desc">
                    轻量、高效、私有化的企业级知识库系统，原生支持 Markdown、KaTeX 公式与交互式图表。
                </p>
            </div>

            <ul class="hero-feature-list">
                <li class="hero-feature-item">
                    <i class="fa fa-check-circle"></i>
                    <span>统一现代化排版引擎与全屏自适应</span>
                </li>
                <li class="hero-feature-item">
                    <i class="fa fa-check-circle"></i>
                    <span>多空间权限隔离与树形知识库编排</span>
                </li>
                <li class="hero-feature-item">
                    <i class="fa fa-check-circle"></i>
                    <span>支持 LDAP / SSO 统一身份登录集成</span>
                </li>
            </ul>
        </div>

        <!-- 右侧 登录表单卡片 -->
        <div class="login-form-panel">
            <div class="login-form-header">
                <h2 class="login-form-title">欢迎登录</h2>
                <p class="login-form-subtitle">请输入您的账号密码进入工作区</p>
            </div>

            <div class="tabs">
                <input type="radio" id="tab1" name="tab-control" checked>
                <input type="radio" id="tab2" name="tab-control">

                <ul class="tabs-nav">
                    <li>
                        <label for="tab1" role="button"><span>普通登录</span></label>
                    </li>
                    <li>
                        <label for="tab2" role="button"><span>统一登录</span></label>
                    </li>
                </ul>

                <div id="login-error-alert" class="alert alert-danger" style="display:none; margin: 12px 0; padding: 10px 14px; border-radius: 8px; font-size: 13.5px; line-height: 1.5; color: #b91c1c; background-color: #fef2f2; border: 1px solid #fecaca;"></div>

                <div class="tabs-content">
                    <!-- 普通登录 -->
                    <section>
                        <form role="form" action="/author/login" method="post" onsubmit="Login.ajaxSubmit(this); return false;">
                            <fieldset>
                                <div class="modern-input-group">
                                    <i class="glyphicon glyphicon-user modern-input-icon"></i>
                                    <input type="text" name="username" class="modern-login-input" placeholder="请输入系统用户名" autocomplete="new-username" onkeydown="KeyDown(event, '#default_login')">
                                </div>
                                <div class="modern-input-group">
                                    <i class="glyphicon glyphicon-lock modern-input-icon"></i>
                                    <input type="password" name="password" class="modern-login-input" placeholder="请输入密码" autocomplete="new-password" onkeydown="KeyDown(event, '#default_login')">
                                </div>
                                <button id="default_login" name="submit" type="button" class="modern-login-btn" onclick="Login.ajaxSubmit(this.form)">
                                    <i class="fa fa-sign-in"></i> 登 录
                                </button>
                            </fieldset>
                        </form>
                    </section>

                    <!-- 统一登录 -->
                    <section>
                        <form role="form" action="/author/authLogin" method="post" onsubmit="Login.ajaxSubmit(this); return false;">
                            <fieldset>
                                <div class="modern-input-group">
                                    <i class="glyphicon glyphicon-user modern-input-icon"></i>
                                    <input type="text" name="username" class="modern-login-input" placeholder="请输入统一登录用户名" {{if ne .sso_open "1"}} disabled="disabled" {{end}} onkeydown="KeyDown(event, '#auth_login')" autocomplete="new-username">
                                </div>
                                <div class="modern-input-group">
                                    <i class="glyphicon glyphicon-lock modern-input-icon"></i>
                                    <input type="password" name="password" class="modern-login-input" placeholder="请输入统一登录密码" {{if ne .sso_open "1"}} disabled="disabled" {{end}} onkeydown="KeyDown(event, '#auth_login')" autocomplete="new-password">
                                </div>
                                <button id="auth_login" name="submit" type="button" class="modern-login-btn" {{if eq .sso_open "1"}} onclick="Login.ajaxSubmit(this.form)" {{else}} disabled="disabled" {{end}}>
                                    <i class="fa fa-sign-in"></i> 登 录
                                </button>
                            </fieldset>
                        </form>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <div class="login-copyright">
        © {{.copyright}} · <a target="_blank" href="https://github.com/phachon/mm-wiki">MM-Wiki Version {{.version}}</a>
    </div>
</div>

<script type="text/javascript">
    if (self != top) {
        parent.location.href = "/"
    }
    function KeyDown(e, element) {
        var evt = e || window.event;
        if (evt && (evt.keyCode == 13 || evt.which == 13)) {
            if (evt.preventDefault) evt.preventDefault();
            evt.returnValue = false;
            $(element).click();
        }
    }
</script>
