<div id="sidebar-wrapper">
    <nav class="navbar navbar-fixed-top modern-navbar">
        <div class="container-fluid">
            <div class="navbar-header">
                <button type="button" class="navbar-toggle modern-nav-toggle" aria-label="展开/收起菜单" onclick="layoutToggle()">
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                    <span class="icon-bar"></span>
                </button>
                <a class="navbar-brand modern-brand" href="/" title="{{.system_name}}">
                    <img src="/static/images/logo_icon.png" class="brand-logo-img" alt="logo">
                    <span class="brand-title">MM-Wiki</span>
                    {{if .system_name}}<span class="brand-subtext">{{.system_name}}</span>{{end}}
                </a>
                <button type="button" class="navbar-toggle modern-nav-toggle" data-toggle="collapse" data-target=".navbar-collapse" aria-label="展开菜单">
                    <i class="glyphicon glyphicon-chevron-down" style="color: #64748b;"></i>
                </button>
            </div>
            <div id="navbar" class="navbar-collapse collapse">
                <ul class="nav navbar-nav modern-nav-links">
                    <li {{if eq .navName "main"}}class="active"{{end}}><a href="/"><i class="fa fa-home"></i>&nbsp;主页</a></li>
                    <li {{if eq .navName "space"}}class="active"{{end}}><a href="/space/index"><i class="fa fa-cube"></i>&nbsp;空间</a></li>
                    <li {{if eq .navName "user"}}class="active"{{end}}><a href="/user/index"><i class="fa fa-user"></i>&nbsp;用户</a></li>
                    <li {{if eq .navName "system"}}class="active"{{end}}><a href="/system/main/index"><i class="fa fa-cog"></i>&nbsp;系统</a></li>
                </ul>
                <form class="navbar-form navbar-left modern-navbar-form visible-md visible-lg" action="#" method="post" onsubmit="return false">
                    <div class="modern-search-container">
                        <i class="fa fa-search modern-search-icon"></i>
                        <input class="form-control modern-search-input" name="keyword" type="text" onkeydown="KeyDown('#search_btn')" placeholder="搜索文档或关键字...">
                        <button class="modern-search-btn" type="button" name="search" id="search_btn" onclick="mainSearch(this.form, '/main/search')" title="开始搜索">
                            <i class="fa fa-arrow-right"></i>
                        </button>
                    </div>
                    <button type="button" onclick="layoutToggle()" class="btn modern-layout-toggle-btn" title="展开/收起侧边栏">
                        <i class="fa fa-columns"></i>
                    </button>
                </form>
                <ul class="nav navbar-nav navbar-right modern-nav-right">
                    <li class="dropdown">
                        <a type="button" data-toggle="web-popover" data-placement="bottom" class="dropdown-trigger-btn">
                            <i class="fa fa-question-circle-o"></i>&nbsp;帮助
                            <span class="caret"></span>
                        </a>
                        <div class="webui-popover-content">
                            <ul class="dropdown-menu webui-popover-menu modern-popover-menu">
                                <li><a href="https://github.com/phachon/mm-wiki" target="_blank"><i class="fa fa-book"></i>&nbsp;在线文档</a></li>
                                <li><a href="https://github.com/phachon/mm-wiki/issues" target="_blank"><i class="fa fa-life-ring"></i>&nbsp;问题反馈</a></li>
                                <li class="divider"></li>
                                <li><a name="about" data-link="/main/about"><i class="fa fa-info-circle"></i>&nbsp;关于 MM-Wiki</a></li>
                            </ul>
                        </div>
                    </li>
                    <li class="dropdown">
                        <a type="button" data-toggle="web-popover" data-placement="bottom" class="dropdown-trigger-btn modern-user-chip">
                            <span class="user-avatar-badge">{{substr .login_username 0 1}}</span>
                            <span class="user-name-text">{{.login_username}}</span>
                            <span class="caret"></span>
                        </a>
                        <div class="webui-popover-content">
                            <ul class="dropdown-menu webui-popover-menu modern-popover-menu">
                                <li><a href="/system/main/index"><i class="glyphicon glyphicon-leaf"></i>&nbsp;个人中心</a></li>
                                <li><a name="repass" data-link="/system/profile/password"><i class="glyphicon glyphicon-lock"></i>&nbsp;修改密码</a></li>
                                <li class="divider"></li>
                                <li><a href="/author/logout" class="text-danger"><i class="glyphicon glyphicon-off"></i>&nbsp;安全退出</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>
<script type="text/javascript">
    if (self != top) {
        parent.location.href = window.location.href
    }
    function KeyDown(element) {
        if (event.keyCode == 13) {
            event.returnValue = false;
            event.cancel = true;
            $(element).click();
        }
    }
    function mainSearch(element, url) {
        var searchText = $(element).find("input[name='keyword']").val();
        url = url + "?keyword="+searchText;
        layer.open({
            type: 2,
            skin: Layers.skin,
            title: '<strong>搜索文档</strong>',
            shadeClose: true,
            shade : 0.6,
            maxmin: true,
            area: ["1000px", "525px"],
            content: url,
            padding:"10px"
        });
    }
    Layers.bindIframe("a[name='repass']", "修改密码", "325px", "800px");
    Layers.bindIframe("a[name='about']", "关于MM-Wiki", "338px", "600px");
</script>
