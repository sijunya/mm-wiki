<div id="main-left" class="ui-layout-west">
    {{$spaceDocument := .space_document}}{{$defaultDocumentId := .default_document_id}}{{$space := .space}}
    <!-- 移动端专属抽屉顶部导航条 -->
    <div class="mobile-drawer-header">
        <div class="mobile-drawer-title">
            <i class="fa fa-cube text-primary"></i>
            <span>{{$spaceDocument.name}}</span>
        </div>
        <button type="button" class="mobile-drawer-close" onclick="window.toggleMobileDrawer(false)" title="关闭侧栏目录">
            <i class="fa fa-times"></i>
        </button>
    </div>
    <div class="left-page">{{$documents := .documents}}
        <div class="page-search">
            <form onsubmit="return false">
                <div class="form-group has-feedback">
                    <i class="glyphicon glyphicon-search form-control-feedback"></i>
                    <input class="form-control input-sm" id="document_search" type="text" value=""
                           placeholder="搜索空间文档..." style="padding-left: 28px;">
                </div>
            </form>
        </div>
        <div class="page-tree">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #f1f5f9;">
                <a href="/document/index?document_id={{$spaceDocument.document_id}}" onclick="if(window.switchDocument){window.switchDocument({{$spaceDocument.document_id}}, '{{$spaceDocument.name}}', true); return false;}" style="font-weight: 700; font-size: 14.5px; color: #0f172a; display: flex; align-items: center; gap: 6px; text-decoration: none;" title="{{$spaceDocument.name}}">
                    <i class="fa fa-cube text-primary" style="font-size: 15px;"></i>
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px;">{{$spaceDocument.name}}</span>
                </a>
                <a name="create_document"
                   data-link="/document/add?space_id={{$spaceDocument.space_id}}&parent_id={{$spaceDocument.document_id}}"
                   class="btn-create-doc" style="padding: 2px 8px; height: 26px; font-size: 12px; font-weight: 500; border-radius: 6px; background: #eff6ff; color: #2563eb; border: 1px solid #bfdbfe; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; cursor: pointer; transition: all 0.15s ease;" title="创建新文档" onmouseover="this.style.background='#dbeafe'" onmouseout="this.style.background='#eff6ff'">
                    <i class="fa fa-plus"></i> 新建
                </a>
            </div>
            <ul id="dir_tree" class="ztree"></ul>
        </div>
    </div>
</div>
<!-- 移动端悬浮目录胶囊按钮 -->
<div id="mobile-tree-fab" class="mobile-tree-fab visible-xs" onclick="window.toggleMobileDrawer(true)" title="展开文档目录">
    <i class="fa fa-bars"></i>
    <span>目录</span>
</div>
<script type="text/javascript" src="/static/js/modules/document.js"></script>
<script type="text/javascript">
    var documentsData = [];
    {{range $document := $documents}}
        var documentData = {
            'spaceId': parseInt({{$document.space_id}}),
            'id': parseInt({{$document.document_id}}),
            'pId': parseInt({{$document.parent_id}}),
            'name': {{$document.name}},
            'open': false,
            'isParent': false
        };
        {{if eq $document.type "2"}}
            documentData.isParent = true;
        {{end}}
        documentsData.push(documentData);
    {{end}}
    Document.ListTree("#dir_tree", documentsData, {{$defaultDocumentId}}, {{.is_editor}}, {{.is_delete}});
    Layers.bindIframe("[name='create_document']", "创建文档", "345px", "800px");
</script>
{{/* markdown显示 */}}
<iframe class="ui-layout-center" id="mainFrame" name="mainFrame" width="100%" frameborder="0" scrolling="yes"
        style="overflow-y: auto; transition: opacity 0.15s ease;" src="/page/view?document_id={{$defaultDocumentId}}"></iframe>
